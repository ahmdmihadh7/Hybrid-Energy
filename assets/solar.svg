<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="solarSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Radiant Sun in background corner -->
  <circle cx="24" cy="24" r="14" fill="url(#solarSunGrad)" filter="url(#glow)"/>
  <g stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="4" x2="24" y2="8" />
    <line x1="24" y1="40" x2="24" y2="44" />
    <line x1="4" y1="24" x2="8" y2="24" />
    <line x1="40" y1="24" x2="44" y2="24" />
    <line x1="10" y1="10" x2="13" y2="13" />
    <line x1="35" y1="35" x2="38" y2="38" />
    <line x1="10" y1="38" x2="13" y2="35" />
    <line x1="35" y1="13" x2="38" y2="10" />
  </g>

  <!-- Panel Mounting Stand -->
  <polygon points="46,85 54,85 52,65 48,65" fill="#64748B" />
  <rect x="36" y="84" width="28" height="5" rx="2" fill="#475569" />

  <!-- PV Module Frame (Tilted 3D perspective) -->
  <polygon points="18,65 82,65 92,36 32,36" fill="url(#frameGrad)" stroke="#38BDF8" stroke-width="1.2" />
  <!-- PV Silicon Face -->
  <polygon points="20,63 80,63 89,38 33,38" fill="url(#panelGrad)" />

  <!-- Grid lines for Photovoltaic Solar Cells -->
  <!-- Horizontal string busbars -->
  <polygon points="23,55 83,55 85,53 25,53" fill="#38BDF8" opacity="0.4" />
  <polygon points="27,47 86,47 88,45 29,45" fill="#38BDF8" opacity="0.4" />
  
  <!-- Vertical cell dividers -->
  <line x1="38" y1="63" x2="47" y2="38" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
  <line x1="52" y1="63" x2="61" y2="38" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
  <line x1="66" y1="63" x2="75" y2="38" stroke="#38BDF8" stroke-width="1" opacity="0.6" />

  <!-- Solar Ray Energy Particles -->
  <path d="M28,34 Q34,42 42,48" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
  <path d="M35,28 Q44,38 56,44" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
</svg>
