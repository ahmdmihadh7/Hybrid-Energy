<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="windGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wind Streamlines in Background -->
  <path d="M10,24 C24,20 34,28 44,24" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" stroke-dasharray="6 4" />
  <path d="M6,36 C18,32 28,40 38,36" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" stroke-dasharray="8 4" />
  <path d="M12,48 C22,44 30,52 42,48" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Foundation & Base -->
  <ellipse cx="60" cy="92" rx="18" ry="4" fill="#334155" />
  <polygon points="56,92 64,92 62,38 58,38" fill="url(#towerGrad)" />

  <!-- Nacelle (Turbine Generator Housing) -->
  <path d="M54,37 C54,34 64,34 68,36 C70,37 70,39 68,40 C64,41 54,41 54,37 Z" fill="#E2E8F0" stroke="#0284C7" stroke-width="0.8" />

  <!-- Rotor Hub -->
  <circle cx="58" cy="38" r="4.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />

  <!-- 3 Aerodynamic Rotor Blades (Static base representation in SVG) -->
  <!-- Blade 1: Pointing Upwards -->
  <path d="M58,36 C57,24 54,12 58,6 C60,12 59,24 58,36 Z" fill="url(#bladeGrad)" />
  <!-- Blade 2: Pointing Lower Right (~120 deg) -->
  <path d="M59,40 C69,45 78,53 82,56 C77,59 67,49 59,40 Z" fill="url(#bladeGrad)" />
  <!-- Blade 3: Pointing Lower Left (~240 deg) -->
  <path d="M56,39 C46,47 37,55 33,57 C38,59 48,49 56,39 Z" fill="url(#bladeGrad)" />

  <circle cx="58" cy="38" r="2" fill="#F8FAFC" />
</svg>
