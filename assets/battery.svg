<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="batBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="chargeLevelGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="batGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Battery Terminal Cap -->
  <rect x="42" y="10" width="16" height="7" rx="3" fill="#64748B" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Outer Battery Enclosure -->
  <rect x="25" y="17" width="50" height="72" rx="8" fill="url(#batBodyGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- Internal Cell Chambers (Stack effect) -->
  <!-- Level 4 (Top) -->
  <rect x="31" y="23" width="38" height="12" rx="3" fill="url(#chargeLevelGrad)" opacity="0.9" />
  <!-- Level 3 -->
  <rect x="31" y="38" width="38" height="12" rx="3" fill="url(#chargeLevelGrad)" opacity="0.9" />
  <!-- Level 2 -->
  <rect x="31" y="53" width="38" height="12" rx="3" fill="url(#chargeLevelGrad)" opacity="0.9" />
  <!-- Level 1 (Bottom) -->
  <rect x="31" y="68" width="38" height="12" rx="3" fill="url(#chargeLevelGrad)" opacity="0.9" />

  <!-- Lightning Bolt Overlay for Active Charge -->
  <polygon points="53,30 43,49 51,49 47,68 60,45 51,45" fill="url(#boltGrad)" filter="url(#batGlow)" stroke="#78350F" stroke-width="0.8" />
</svg>
