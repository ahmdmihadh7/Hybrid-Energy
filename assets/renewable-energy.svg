<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Interconnected Grid Orbit Circle -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Center Energy Management Hub -->
  <circle cx="60" cy="60" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" filter="url(#hubGlow)" />
  <!-- Central Pulse / Power Icon -->
  <path d="M57,51 L53,60 L59,60 L57,69 L67,58 L61,58 Z" fill="#FBBF24" />

  <!-- Connector Lines to 4 Peripherals -->
  <line x1="60" y1="44" x2="60" y2="24" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="44" y1="60" x2="24" y2="60" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="60" y1="76" x2="60" y2="96" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="76" y1="60" x2="96" y2="60" stroke="#EC4899" stroke-width="2" stroke-dasharray="2 2" />

  <!-- Top Node: Solar Sun & PV (Amber) -->
  <circle cx="60" cy="18" r="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
  <polygon points="53,22 67,22 65,14 55,14" fill="#FBBF24" opacity="0.9" />
  <line x1="60" y1="14" x2="60" y2="22" stroke="#1E293B" stroke-width="1" />

  <!-- Left Node: Wind Turbine (Cyan) -->
  <circle cx="18" cy="60" r="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2" />
  <line x1="18" y1="68" x2="18" y2="58" stroke="#94A3B8" stroke-width="1.5" />
  <circle cx="18" cy="58" r="2" fill="#06B6D4" />
  <path d="M18,58 L18,50 M18,58 L24,63 M18,58 L12,63" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom Node: Battery BESS (Green) -->
  <circle cx="60" cy="102" r="12" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <rect x="55" y="97" width="10" height="12" rx="2" fill="#10B981" />
  <rect x="58" y="95" width="4" height="2" fill="#94A3B8" />

  <!-- Right Node: Electrical Load / House (Rose/Violet) -->
  <circle cx="102" cy="60" r="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
  <polygon points="102,52 95,58 109,58" fill="#EC4899" />
  <rect x="97" y="58" width="10" height="8" fill="#F43F5E" />
</svg>
